appId: io.github.ssjkasper.poe2tracker
productName: PoE2 Tracker
copyright: MIT — not affiliated with or endorsed by Grinding Gear Games
directories:
  output: dist
  buildResources: build-resources
files:
  - out/**
  - package.json
asar: true
extraResources:
  # Calculation engine: unmodified Path of Building (MIT) + LuaJIT, built by scripts/build-engine-pack.mjs
  - from: build/engine
    to: engine
  - from: resources/pob/bridge.lua
    to: pob/bridge.lua
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  # Window icon (the installer and .exe use build-resources/icon.ico)
  - from: resources/icon.png
    to: icon.png
win:
  icon: build-resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: PoE2-Tracker-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  installerIcon: build-resources/icon.ico
  uninstallerIcon: build-resources/icon.ico
  shortcutName: PoE2 Tracker
linux:
  icon: build-resources/icon.png
  target:
    - target: dir
  category: Game
# Updates: the app reads latest.yml from the GitHub Releases of this repo (electron-updater).
# Builds never publish by themselves (--publish never): the Windows workflow attaches the files
# to the release when a v* tag is pushed.
publish:
  provider: github
  owner: SSJKaspeR
  repo: poe2-tracker
  releaseType: release
