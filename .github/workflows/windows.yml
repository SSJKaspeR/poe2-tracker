name: Windows build

# Builds the Windows installer and runs every test on a real Windows machine,
# including the end-to-end test against the installed (packaged) app.
# Full battery: runs for release tags (v*), by hand (Actions → Windows build → Run workflow)
# or when the commit message contains [full].
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # attach the installer to the GitHub Release on v* tags

jobs:
  windows:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full]')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Release tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }

      # MSVC toolchain for LuaJIT (msvcbuild.bat).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache engine sources
        uses: actions/cache@v4
        with:
          path: .pob/cache
          key: engine-src-${{ runner.os }}-${{ hashFiles('engine.json') }}

      - name: Build engine pack (Path of Building + LuaJIT)
        run: npm run build:engine

      - run: npm run typecheck
      - run: npm test

      - name: Tests on the real PoB engine (Windows build)
        run: npm run test:pob
        env:
          POB_ENGINE_DIR: ${{ github.workspace }}\build\engine

      - name: Build installer
        run: npm run dist:win

      - name: Update files are generated
        shell: bash
        run: |
          ls dist
          test -f dist/latest.yml
          test -f "dist/win-unpacked/resources/app-update.yml"
          cat dist/latest.yml

      - name: End-to-end test on the packaged app
        shell: bash
        run: |
          mkdir -p e2e-screenshots
          E2E_SCREENSHOTS="$PWD/e2e-screenshots" \
          E2E_EXECUTABLE="$PWD/dist/win-unpacked/PoE2 Tracker.exe" \
          node tests/e2e/app.e2e.mjs

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PoE2-Tracker-Windows-installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-windows
          path: e2e-screenshots/
          if-no-files-found: ignore

      - name: Publish the GitHub Release (installer + update files)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls dist
          gh release create "${GITHUB_REF_NAME}" \
            --title "PoE2 Tracker ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            dist/*.exe dist/*.exe.blockmap dist/latest.yml

