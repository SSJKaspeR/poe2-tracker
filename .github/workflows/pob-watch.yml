name: Path of Building watch

# Once a day: is there a newer Path of Building (PoE 2) release than the one pinned in
# engine.json? If so, open an issue (once per version) as a reminder to bump the engine,
# run the full battery ([full]) and publish an app release (players update automatically).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare with the latest PoB PoE 2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(node -p "require('./engine.json').pob.ref")
          # PoE 2 versions are v0.x; the repo also holds old PoE 1 tags (v2.x).
          latest=$(gh api repos/PathOfBuildingCommunity/PathOfBuilding-PoE2/releases --jq \
            '[.[] | select(.draft == false and (.tag_name | test("^v0\\.")))][0].tag_name')
          echo "pinned=$pinned latest=$latest"
          if [ -z "$latest" ] || [ "$latest" = "$pinned" ]; then exit 0; fi
          newest=$(printf '%s\n%s\n' "${pinned#v}" "${latest#v}" | sort -V | tail -1)
          if [ "$newest" != "${latest#v}" ]; then exit 0; fi
          title="Path of Building ${latest} is out (engine pinned at ${pinned})"
          if gh issue list --state all --search "\"$title\" in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "issue already exists"; exit 0
          fi
          gh issue create --title "$title" --body "New PoB PoE 2 release: https://github.com/PathOfBuildingCommunity/PathOfBuilding-PoE2/releases/tag/${latest}

          To ship it:
          1. Set \`pob.ref\` to \`${latest}\` in \`engine.json\`
          2. Commit with \`[full]\` in the message: full battery on Linux and Windows
          3. Bump \`version\` in package.json, update RELEASE_NOTES.md, push a \`v<version>\` tag: players get the update automatically"
