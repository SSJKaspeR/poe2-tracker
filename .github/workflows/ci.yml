name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Cache engine sources
        uses: actions/cache@v4
        with:
          path: .pob/cache
          key: engine-src-${{ runner.os }}-${{ hashFiles('engine.json') }}
      - run: npm run build:engine
      - run: npm run test:pob
      - run: npm run build
      - run: xvfb-run -a npm run test:e2e
